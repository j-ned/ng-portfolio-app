<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Julien Nédellec | Sites et applications web, Yvelines</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- SEO Meta Tags -->
    <meta
      name="description"
      content="Sites et applications web livrés en production par un seul interlocuteur : site vitrine en 7 jours, application sur mesure, maintenance. Yvelines et à distance."
    />
    <meta
      name="keywords"
      content="Développeur Angular, Développeur NestJS, TypeScript, Full-Stack, PostgreSQL, Docker, Développeur Web, France, Voisins-Le-Bretonneux"
    />
    <meta name="author" content="Julien Nédellec" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://nedellec-julien.fr/" />

    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Julien Nédellec | Sites et applications web, Yvelines" />
    <meta
      property="og:description"
      content="Sites et applications web livrés en production par un seul interlocuteur : site vitrine en 7 jours, application sur mesure, maintenance. Yvelines et à distance."
    />
    <meta property="og:url" content="https://nedellec-julien.fr/" />
    <meta property="og:site_name" content="Julien Nédellec Portfolio" />
    <meta property="og:image" content="https://nedellec-julien.fr/avatar.png" />
    <meta property="og:image:alt" content="Photo de profil de Julien Nédellec" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Format de carte (grande image) : lu par Discord, Slack… ; le reste vient d'Open Graph -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#000000" />
    <meta name="format-detection" content="telephone=no" />

    <!-- CSP via meta tag, complétée par les headers HTTP Traefik/Dokploy pour frame-ancestors et HSTS.
         Giscus (commentaires du blog) : client.js dans script-src, widget dans frame-src, et
         default.css dans style-src (client.js l'injecte dans la page hôte pour dimensionner l'iframe).
         Avatars et API vivent dans l'iframe et relèvent de la CSP de giscus.app. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://giscus.app; style-src 'self' 'unsafe-inline' https://giscus.app; font-src 'self'; img-src 'self' data: blob: https://api.nedellec-julien.fr; connect-src 'self' https://api.nedellec-julien.fr https://o4511049353723904.ingest.de.sentry.io; worker-src 'self' blob:; object-src 'none'; frame-src https://giscus.app; base-uri 'self'; form-action 'self';"
    />
    <!-- Pré-peinture du thème : clé et règle de ThemeStore dupliquées ; après la CSP, car une CSP en <meta> ne régit que ce qui la suit -->
    <script>
      try {
        var t = localStorage.getItem('j-ned:theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('app-dark');
      } catch (e) {}
    </script>
    <!-- Police du h1 (LCP) seule ; crossorigin requis même en même origine, sinon double téléchargement -->
    <link
      rel="preload"
      href="/fonts/archivo-2.001-latin-wdth100-110-wght600-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Preconnect API NestJS : handshake TCP+TLS anticipé, ~50-100ms gagnés vs dns-prefetch seul -->
    <link rel="preconnect" href="https://api.nedellec-julien.fr" crossorigin />
    <link rel="dns-prefetch" href="https://api.nedellec-julien.fr" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="alternate" type="application/rss+xml" title="Blog Julien Nédellec" href="/rss.xml" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
