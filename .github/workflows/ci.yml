name: CI

# Pull requests seulement : un merge sur master est construit par Dokploy avec le même Dockerfile.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un run par branche/PR : le nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build · Test · Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Un seul passage BuildKit : étage `test` (lint, format, icônes, typage e2e, Vitest) et image
      # de production, en parallèle sur les mêmes sources installées, avec le cache GHA.
      - name: Build and test (Dockerfile)
        uses: docker/bake-action@v6
        with:
          source: .
          targets: ci
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      # Les garanties du build de production, jugées sur les fichiers que l'image sert.
      - name: Verify served build
        run: |
          set -euo pipefail
          id=$(docker create ng-portfolio-app:ci)
          docker cp -q "$id:/usr/share/nginx/html" /tmp/browser
          docker cp -q "$id:/app/server" /tmp/server
          docker rm -f "$id" > /dev/null
          ci/verify-prerender.sh /tmp/browser /tmp/server

      - name: Smoke test the image
        run: ci/smoke.sh ng-portfolio-app:ci
